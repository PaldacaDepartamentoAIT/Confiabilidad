[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Las migraciones son autogeneradas; sus help_text largos no deben romper el lint.
"*/migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# Librerías de terceros sin type stubs: no bloqueamos por imports no tipados.
module = ["environ.*", "celery.*", "channels.*", "channels_redis.*", "django_celery_beat.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "manage.py",
    "config/asgi.py",
    "config/wsgi.py",
    "config/celery.py",
    "config/settings.py",
    "*/migrations/*",
    "*/tests/*",
]
