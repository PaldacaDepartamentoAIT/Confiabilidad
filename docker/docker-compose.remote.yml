services:
  db:
    ports: !override
      - "127.0.0.1:${DB_PORT:-5432}:5432"
  redis:
    ports: !override
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
