name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: confiabilidad
          POSTGRES_USER: confiabilidad
          POSTGRES_PASSWORD: confiabilidad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U confiabilidad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-insecure-key
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_HARDENING: "0"
      DATABASE_URL: postgres://confiabilidad:confiabilidad@localhost:5432/confiabilidad
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Black (formato)
        run: black --check .
      - name: Mypy (tipos, strict)
        run: mypy .
      - name: Pytest (tests + cobertura ≥ 80%)
        run: pytest

  frontend:
    name: Frontend (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter frontend lint
      - name: TypeScript (tsc --noEmit)
        run: pnpm --filter frontend typecheck
      - name: Vitest (tests + cobertura ≥ 80%)
        run: pnpm --filter frontend test:coverage

  desktop:
    name: Desktop (rustfmt · clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala dependencias de sistema de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Build del frontend (Tauri necesita frontendDist)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter frontend build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Rustfmt (formato)
        run: cargo fmt --check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Clippy (lint, warnings = error)
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings

  secrets:
    name: Secretos (sin valores en claro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifica que no haya secretos en claro versionados
        run: |
          matches="$(git ls-files | grep -E '\.env(\.|$)' | grep -Ev '\.env\.example$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::Archivos .env en claro versionados (solo se permiten *.enc.* y .env.example):"
            echo "$matches"
            exit 1
          fi
          echo "OK: no hay archivos .env en claro versionados."
